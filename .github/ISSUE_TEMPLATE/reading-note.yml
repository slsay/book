name: "📚 读书笔记"
description: "记录一本书的阅读笔记和心得体会"
title: "[读书笔记] 书名 - 作者"
labels: ["reading-note", "未读"]

body:
  - type: markdown
    attributes:
      value: |
        感谢你分享读书笔记！📖  
        请填写以下信息来记录这本书的阅读过程与个人思考。

  - type: input
    id: book-title
    attributes:
      label: "📖 书名"
      description: "书籍的完整名称"
      placeholder: "例如：西西弗神话"
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: "✍️ 作者"
      description: "作者姓名"
      placeholder: "例如：阿尔贝·加缪"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: "📂 分类"
      description: "书籍所属分类"
      options:
        - "01-哲学与思想"
        - "02-政治理论"
        - "03-历史与文化"
        - "04-文学"
        - "05-心理学"
        - "06-个人成长"
        - "07-管理与商业"
        - "08-语言学习-日语"
        - "09-技术开发"
        - "10-工具方法论"
        - "11-艺术修养"
        - "99-其他未分类"
    validations:
      required: true

  - type: dropdown
    id: rating
    attributes:
      label: "⭐ 评分"
      description: "对这本书的整体评价"
      options:
        - "2 - 强烈推荐，必读经典"
        - "1 - 值得一读，质量良好"
        - "0 - 一般或不推荐"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: "🎯 优先级"
      description: "阅读优先级"
      options:
        - "高"
        - "中"
        - "低"
    validations:
      required: false

  - type: input
    id: start-date
    attributes:
      label: "📅 开始阅读日期"
      description: "格式：YYYY-MM-DD"
      placeholder: "2025-01-15"
    validations:
      required: false

  - type: input
    id: finish-date
    attributes:
      label: "📅 完成阅读日期"
      description: "格式：YYYY-MM-DD"
      placeholder: "2025-02-20"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: "📝 内容摘要"
      description: "用 1–3 句话概括本书的核心内容"
      placeholder: |
        这本书主要讲述了……
    validations:
      required: false

  - type: textarea
    id: key-takeaways
    attributes:
      label: "💡 核心要点"
      description: "列出书中最重要的 3–5 个观点或收获"
      placeholder: |
        1. 第一个要点
        2. 第二个要点
        3. 第三个要点
    validations:
      required: false

  - type: textarea
    id: quotes
    attributes:
      label: "📌 金句摘录"
      description: "摘录书中让你印象深刻的句子或段落"
      placeholder: |
        > “引用的句子 1”
        > —— 出处（页码）

        > “引用的句子 2”
        > —— 出处（页码）
    validations:
      required: false

  - type: textarea
    id: thoughts
    attributes:
      label: "💭 个人思考"
      description: "你的感悟、启发和联想"
      placeholder: |
        读完这本书后，我认为……

        它让我想起了……

        我打算将这些思想应用到……
    validations:
      required: false

  - type: textarea
    id: questions
    attributes:
      label: "❓ 待探讨的问题"
      description: "阅读过程中产生的疑问或想深入研究的话题"
      placeholder: |
        1. 问题 1
        2. 问题 2
    validations:
      required: false

  - type: textarea
    id: related-books
    attributes:
      label: "🔗 相关推荐"
      description: "与本书主题相关的其他书籍或资源"
      placeholder: |
        - 书名 1 - 作者 1
        - 书名 2 - 作者 2
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: "🏷️ 标签"
      description: "用逗号分隔的关键词标签"
      placeholder: "存在主义, 哲学, 经典, 法国文学"
    validations:
      required: false

  - type: textarea
    id: action-items
    attributes:
      label: "✅ 行动清单"
      description: "读完这本书后你计划采取的具体行动"
      placeholder: |
        - [ ] 行动 1
        - [ ] 行动 2
        - [ ] 行动 3
    validations:
      required: false

  - type: checkboxes
    id: recommendation
    attributes:
      label: "📢 推荐意愿"
      description: "你会推荐这本书吗？"
      options:
        - label: "我会主动推荐给朋友"
        - label: "适合特定人群阅读"
        - label: "不推荐"

  - type: textarea
    id: additional-notes
    attributes:
      label: "📎 其他备注"
      description: "任何其他想要记录的信息"
      placeholder: |
        - 购买链接
        - 相关课程
        - 作者背景
        - 阅读环境
    validations:
      required: false
